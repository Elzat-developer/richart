name: Deploy Industrial Frontend

on:
  push:
    branches:
      - main  # Скрипт сработает при пуше в ветку main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # После этого появится папка dist или build

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Если React создает папку 'dist', оставь dist/*. Если 'build', поменяй на build/*
          source: "dist/*"
          target: "/var/www/industrial-furniture/frontend"
          strip_components: 1 # Убирает папку dist/ и кладет сразу содержимое
          rm: true
          overwrite: true

      - name: Reload Nginx on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== 1. Checking docker-compose and configs ==="
            cat /opt/richart/docker-compose*.yml 2>/dev/null || true
            docker exec richart-nginx cat /etc/nginx/conf.d/default.conf 2>/dev/null || true
            
            echo "=== 2. Assets in /var/www/industrial-furniture/frontend/assets ==="
            ls -la /var/www/industrial-furniture/frontend/assets/
            
            echo "=== 3. Copying dist into richart-frontend and richart-nginx ==="
            docker cp /var/www/industrial-furniture/frontend/. richart-frontend:/usr/share/nginx/html/ 2>/dev/null || true
            docker cp /var/www/industrial-furniture/frontend/. richart-nginx:/usr/share/nginx/html/ 2>/dev/null || true
            
            echo "=== 4. Restarting richart-frontend and richart-nginx ==="
            docker restart richart-frontend richart-nginx || true
            
            echo "=== 5. Checking inside richart-frontend ==="
            docker exec richart-frontend grep -o 'index-[^"]*' /usr/share/nginx/html/index.html || true
            docker exec richart-frontend ls -la /usr/share/nginx/html/assets/ || true
            echo "=== Done! ==="