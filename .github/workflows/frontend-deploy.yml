name: Deploy Industrial Frontend

on:
  push:
    branches:
      - main  # Скрипт сработает при пуше в ветку main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build  # После этого появится папка dist или build

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Если React создает папку 'dist', оставь dist/*. Если 'build', поменяй на build/*
          source: "dist/*"
          target: "/var/www/industrial-furniture/frontend"
          strip_components: 1 # Убирает папку dist/ и кладет сразу содержимое
          rm: true
          overwrite: true

      - name: Reload Nginx on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== 1. Checking /var/www/industrial-furniture/frontend ==="
            ls -la /var/www/industrial-furniture/frontend
            grep -o 'index-[^"]*' /var/www/industrial-furniture/frontend/index.html || true
            
            echo "=== 2. Finding any directories with old assets ==="
            OLD_FILES=$(find / -name "index-C4N-Lf7f.js" 2>/dev/null || true)
            echo "Old file locations: $OLD_FILES"
            for f in $OLD_FILES; do
              DIR=$(dirname "$f")
              BASE_DIR=$(dirname "$DIR")
              echo "Updating target base dir: $BASE_DIR"
              cp -r /var/www/industrial-furniture/frontend/* "$BASE_DIR/" 2>/dev/null || true
            done

            echo "=== 3. Checking running docker containers ==="
            docker ps -a || true
            for c in $(docker ps -q 2>/dev/null || true); do
              echo "Checking container $c:"
              if docker exec $c test -d /usr/share/nginx/html 2>/dev/null; then
                echo "Copying into container $c:/usr/share/nginx/html/..."
                docker cp /var/www/industrial-furniture/frontend/. $c:/usr/share/nginx/html/
                docker exec $c nginx -s reload 2>/dev/null || true
              fi
              if docker exec $c test -d /var/www/html 2>/dev/null; then
                echo "Copying into container $c:/var/www/html/..."
                docker cp /var/www/industrial-furniture/frontend/. $c:/var/www/html/
              fi
            done
            
            echo "=== 4. Reloading host Nginx ==="
            nginx -s reload || systemctl reload nginx || service nginx reload || true
            echo "=== Done! ==="